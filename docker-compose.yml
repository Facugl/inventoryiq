services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      INVENTORYIQ_CSV_BASE_PATH: /app/data/csv
    ports:
      - "${BACKEND_PORT}:8080"
    volumes:
      # Escritura necesaria: IngestCsvFileUseCase (POST /api/v1/csv-ingestions)
      # persiste ventas aceptadas agregándolas a ventas.csv (CsvSaleRepositoryAdapter).
      - ./data/csv:/app/data/csv

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      VITE_BACKEND_URL: http://backend:8080
    ports:
      - "${FRONTEND_PORT}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata: