name: Keep Render backend awake

# El plan free de Render duerme el servicio tras ~15 min sin tráfico, y el
# cold-start de este backend (Spring Boot + Flyway + Hibernate) tarda más
# de 2 minutos. Pinguear /health cada 5 minutos (mínimo práctico) achica
# la ventana de atraso antes de esos 15 min.
#
# Nota: los cron de GitHub Actions son "best effort" (pueden atrasarse en
# horas de mucha carga de GitHub, a veces más de 15 min) y se desactivan
# solos si el repo pasa 60 días sin actividad — si esto sigue fallando,
# un servicio externo dedicado como UptimeRobot (free, intervalo real de
# 5 min) es más confiable que un cron de Actions para este uso puntual.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health check
        run: curl -sf https://inventoryiq-backend-x234.onrender.com/health
