name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests (Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        run: ./mvnw test

  frontend:
    name: Frontend tests, lint & build (pnpm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # Sin `version`: la toma del campo `packageManager` de
      # frontend/package.json, que es la misma que usa el Dockerfile. Una
      # sola fuente de verdad en vez de dos que se desincronizan.
      #
      # `package_json_file` hace falta porque el repo no tiene package.json en
      # la raíz y la ruta es relativa a GITHUB_WORKSPACE: el
      # `working-directory` de `defaults.run` aplica sólo a los pasos `run:`,
      # no a los `uses:`, así que sin esto la action no encuentra dónde leer
      # la versión y falla antes de instalar nada.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # pnpm 11.x requiere Node >= 22.13 (usa node:sqlite internamente,
          # built-in desde 22.5) — con Node 20 falla al arrancar, antes de
          # llegar a instalar nada.
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Corre antes del build porque falla más rápido. El test de contrato de
      # códigos de error lee archivos del backend por ruta relativa, así que
      # necesita el repo completo — que es lo que deja actions/checkout.
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  etl:
    name: ETL tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: etl
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # El paquete no tiene dependencias de runtime: todo sale de la
      # biblioteca estándar. Lo único que se instala es pytest.
      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -q
