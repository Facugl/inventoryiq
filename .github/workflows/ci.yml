name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests (Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        run: ./mvnw test

  frontend:
    name: Frontend tests, lint & build (pnpm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # Sin `version`: la toma del campo `packageManager` de
      # frontend/package.json, que es la misma que usa el Dockerfile. Una
      # sola fuente de verdad en vez de dos que se desincronizan.
      #
      # `package_json_file` hace falta porque el repo no tiene package.json en
      # la raíz y la ruta es relativa a GITHUB_WORKSPACE: el
      # `working-directory` de `defaults.run` aplica sólo a los pasos `run:`,
      # no a los `uses:`, así que sin esto la action no encuentra dónde leer
      # la versión y falla antes de instalar nada.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # pnpm 11.x requiere Node >= 22.13 (usa node:sqlite internamente,
          # built-in desde 22.5) — con Node 20 falla al arrancar, antes de
          # llegar a instalar nada.
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Corre antes del build porque falla más rápido. El test de contrato de
      # códigos de error lee archivos del backend por ruta relativa, así que
      # necesita el repo completo — que es lo que deja actions/checkout.
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  etl:
    name: ETL tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: etl
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # El paquete no tiene dependencias de runtime: todo sale de la
      # biblioteca estándar. Lo único que se instala es pytest.
      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -q

  # Los otros tres jobs NO construyen las imágenes Docker: corren tests, lint y
  # build con las herramientas nativas. Eso dejó pasar dos bugs seguidos que
  # rompieron el deploy de Render durante tres días, sin que CI se pusiera en
  # rojo ni una vez:
  #
  #   1. El Dockerfile del frontend hacía `npm install` en un proyecto pnpm.
  #      Lo habría visto cualquier build de la imagen.
  #   2. `pnpm run dev -- --host` le pasa el `--` literal al script y Vite
  #      ignora el resto, así que el contenedor arrancaba escuchando en el
  #      puerto equivocado. Ese NO lo habría visto un build: hay que levantar
  #      el contenedor y pedirle algo.
  #
  # Por eso este job construye y además levanta: `docker compose up` es el
  # mismo camino que documenta el README para arrancar el proyecto, así que
  # verifica de paso que esas instrucciones sigan siendo ciertas.
  docker:
    name: Docker images build & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare env file
        run: cp .env.example .env

      - name: Build images and start the stack
        run: docker compose up -d --build

      # El backend tarde: Spring Boot, Flyway y la carga de los CSV. El bucle
      # espera hasta 3 minutos y falla con un motivo en vez de colgarse.
      - name: Wait for the backend health check
        run: |
          for i in $(seq 1 36); do
            if [ "$(curl -fsS http://localhost:8080/health 2>/dev/null)" = "OK" ]; then
              echo "backend OK en el intento $i"
              exit 0
            fi
            sleep 5
          done
          echo "El backend no respondió OK en /health tras 3 minutos"
          exit 1

      - name: Wait for the frontend to serve
        run: |
          for i in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5173/ 2>/dev/null)
            if [ "$code" = "200" ]; then
              echo "frontend 200 en el intento $i"
              exit 0
            fi
            sleep 5
          done
          echo "El frontend no devolvió 200 tras 2 minutos"
          exit 1

      # Sin esto, un fallo acá se lee como "algo no respondió" y hay que
      # reproducirlo a mano para saber por qué.
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v
